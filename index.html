<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ZH Story">
<meta name="theme-color" content="#000000">
<title>ZH Story</title>
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://server.arcgisonline.com">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="map"></div>
<div id="vignette" aria-hidden="true"></div>

<!-- sci-fi corner vignettes: bottom-left, and a rotated copy for top-right -->
<div id="fx" aria-hidden="true">
  <div class="fx-corner bl">
    <div class="fx-grp glow">
      <div class="fx-dark"></div>
      <div class="fx-blob b1"></div><div class="fx-blob b2"></div><div class="fx-blob b3"></div>
      <div class="fx-grid"></div>
      <div class="fx-scan"></div>
    </div>
    <div class="fx-grp rings">
      <svg class="fx-ring r1" viewBox="0 0 200 200"><circle cx="100" cy="100" r="60"/></svg>
      <svg class="fx-ring r2" viewBox="0 0 200 200"><circle cx="100" cy="100" r="78"/></svg>
      <svg class="fx-ring r3" viewBox="0 0 200 200"><circle cx="100" cy="100" r="94"/></svg>
    </div>
  </div>
  <div class="fx-corner tr">
    <div class="fx-grp glow">
      <div class="fx-dark"></div>
      <div class="fx-blob b1"></div><div class="fx-blob b2"></div><div class="fx-blob b3"></div>
      <div class="fx-grid"></div>
      <div class="fx-scan"></div>
    </div>
    <div class="fx-grp rings">
      <svg class="fx-ring r1" viewBox="0 0 200 200"><circle cx="100" cy="100" r="60"/></svg>
      <svg class="fx-ring r2" viewBox="0 0 200 200"><circle cx="100" cy="100" r="78"/></svg>
      <svg class="fx-ring r3" viewBox="0 0 200 200"><circle cx="100" cy="100" r="94"/></svg>
    </div>
  </div>
</div>

<!-- start-up: a short red glow flash -->
<div id="flash" aria-hidden="true"></div>

<!-- HUD -->
<header id="hud">
  <div class="hud-left">
    <div id="clock">--:--</div>
    <div id="date">—</div>
  </div>
  <div class="hud-right">
    <button class="icon-btn" id="btnPlan" aria-label="Day plan">
      <svg viewBox="0 0 24 24"><path d="M7 2h2v2h6V2h2v2h3v18H4V4h3zm-1 4v14h12V6h-1v2h-2V6H9v2H7V6zm2 4h8v2H8zm0 4h8v2H8zm0 4h5v2H8z"/></svg>
    </button>
    <button class="icon-btn" id="btnArchive" aria-label="Archive">
      <svg viewBox="0 0 24 24"><path d="M4 4h6a3 3 0 0 1 2 1 3 3 0 0 1 2-1h6v15h-6a2 2 0 0 0-2 1 2 2 0 0 0-2-1H4zm2 2v11h4c.7 0 1.4.2 2 .5V7a1 1 0 0 0-1-1zm12 0h-5a1 1 0 0 0-1 1v10.5c.6-.3 1.3-.5 2-.5h4z"/></svg>
    </button>
    <button class="icon-btn" id="btnMenu" aria-label="Menu">
      <svg viewBox="0 0 24 24"><path d="M12 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4zm0 6a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></svg>
    </button>
  </div>
</header>

<div id="modeTitle"><span id="modeName">All</span><small id="modeCount"></small></div>

<!-- GTA-style legend / mode bar -->
<nav id="modebar"></nav>

<!-- bottom controls -->
<div id="bottomBar">
  <button class="round-btn" id="btnList" aria-label="Objective list">
    <svg viewBox="0 0 24 24"><path d="M4 6h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8zm-4 5h2v2H4zm4 0h12v2H8z"/></svg>
  </button>
  <button id="btnAdd" aria-label="New objective"><svg viewBox="0 0 24 24"><path d="M10.5 3h3v7.5H21v3h-7.5V21h-3v-7.5H3v-3h7.5z"/></svg></button>
  <button class="round-btn" id="btnLocate" aria-label="My location">
    <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zm-1-6h2v3.1A7 7 0 0 1 18.9 11H22v2h-3.1A7 7 0 0 1 13 18.9V22h-2v-3.1A7 7 0 0 1 5.1 13H2v-2h3.1A7 7 0 0 1 11 5.1zm1 5a5 5 0 1 0 0 10 5 5 0 0 0 0-10z"/></svg>
  </button>
</div>

<!-- Pick-on-map mode -->
<div id="picker" hidden>
  <div class="picker-top">
    <div class="search">
      <input id="searchInput" type="search" placeholder="Search address or place…" autocomplete="off">
      <div id="searchResults"></div>
    </div>
    <div class="picker-hint" id="pickerHint">Drag the map to place the marker</div>
  </div>
  <div id="crosshair"><div class="blip big" id="crossBlip"></div><div class="cross-shadow"></div></div>
  <div class="picker-bottom">
    <div id="pickChips"></div>
    <div id="pickPlace">…</div>
    <div class="row">
      <button class="btn ghost" id="pickCancel">Cancel</button>
      <button class="btn ghost" id="pickMe">📍 Me</button>
      <button class="btn primary" id="pickOk">Set place</button>
    </div>
  </div>
</div>

<!-- bottom sheet -->
<div id="scrim" hidden></div>
<section id="sheet" aria-modal="true" role="dialog"><div class="grab"></div><div id="sheetBody"></div></section>

<!-- full screen archive -->
<section id="archive" hidden>
  <div class="arch-head">
    <button class="icon-btn" id="archClose" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15.4 4.6 8 12l7.4 7.4-1.4 1.4L5.2 12 14 3.2z"/></svg></button>
    <h1>Archive</h1>
    <button class="icon-btn" id="archAdd" aria-label="New archive entry"><svg viewBox="0 0 24 24"><path d="M10.5 3h3v7.5H21v3h-7.5V21h-3v-7.5H3v-3h7.5z"/></svg></button>
  </div>
  <div id="archBody"></div>
</section>

<!-- splash banners -->
<div id="banner" hidden><div class="b-top" id="bTop"></div><div class="b-main" id="bMain"></div><div class="b-sub" id="bSub"></div></div>
<div id="toast" hidden></div>

<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="zh-boundary.js"></script>
<script src="borders.js"></script>
<script src="app.js"></script>
</body>
</html>
